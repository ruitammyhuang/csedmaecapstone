<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="EDG6973 Capstone Project (Project in Lieu of Thesis) course hub." />
  <meta name="theme-color" content="#ffffff" />
  <meta name="robots" content="index,follow" />

  <meta property="og:title" content="EDG6973 - Capstone Project" />
  <meta property="og:description" content="Course hub for EDG6973 - Capstone Project (Project in Lieu of Thesis)." />
  <meta property="og:type" content="website" />

  <title>EDG6973 - Capstone Project</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>

<body>
<a class="skip-link" href="#main">Skip to content</a>

<!-- ===================================================== -->
<!-- AUTH GATE (shown when NOT authorized) -->
<!-- ===================================================== -->
<main id="authGate" class="container page" style="display:none;">
  <section class="card section" style="max-width:720px; margin:40px auto;">
    <header class="section-header">
      <h1 class="section-title" style="color:#002657;">EDG 6973</h1>
      <p class="section-subtitle">Capstone Project (Project in Lieu of Thesis)</p>
    </header>

    <!-- Dynamic auth title -->
    <h2 id="authTitle" class="section-title" style="display:none; margin-bottom:12px;"></h2>

    <!-- Tabs (hidden for guided flows) -->
    <div id="authTabs" class="task-actions" style="gap:8px; margin-bottom:12px;">
      <button class="btn ghost" id="tabSignup" type="button">Sign up</button>
      <button class="btn ghost" id="tabSignin" type="button">Sign in</button>
    </div>

    <div class="section-body">

      <!-- SIGN UP: magic link -->
      <div id="panelSignup" style="display:none;">
        <p class="muted">
          Enter your email to receive a sign-up link.
        </p>

        <label class="field">
          <span>Email</span>
          <input id="signupEmail" type="email" placeholder="you@ufl.edu" autocomplete="email" />
        </label>

        <div class="task-actions" style="align-items:center;">
          <button class="btn" id="signupSendLinkBtn" type="button">
            Send sign-up link
          </button>
          <span class="hint" id="signupMsg"></span>
        </div>
      </div>

      <!-- SIGN IN -->
      <div id="panelSignin" style="display:none;">
        <p class="muted">
          Sign in with your email and password.
        </p>

        <label class="field">
          <span>Email</span>
          <input id="signinEmail" type="email" autocomplete="email" />
        </label>

        <label class="field">
          <span>Password</span>
          <input id="signinPassword" type="password" autocomplete="current-password" />
        </label>

        <div class="task-actions" style="align-items:center;">
          <button class="btn" id="signinBtn" type="button">Sign in</button>
          <button class="btn ghost" id="forgotBtn" type="button">Forgot password</button>
          <span class="hint" id="signinMsg"></span>
        </div>
      </div>

      <!-- COMPLETE USER INFO -->
      <div id="panelUserInfo" style="display:none; margin-top:16px;">
        <div class="callout">
          <div class="callout-title">Complete your information</div>

          <label class="field">
            <span>Full name</span>
            <input id="uiFullName" type="text" autocomplete="name" />
          </label>

          <label class="field">
            <span>Affiliation</span>
            <input id="uiAffiliation" type="text" autocomplete="organization" />
          </label>

          <div class="task-actions">
            <button class="btn" id="uiSaveBtn" type="button">
              Save and continue
            </button>
            <span class="hint" id="uiMsg"></span>
          </div>
        </div>
      </div>

      <!-- SET PASSWORD -->
      <div id="panelSetPassword" style="display:none; margin-top:16px;">
        <div class="callout">
          <div class="callout-title">Set your password</div>

          <label class="field">
            <span>New password</span>
            <input id="newPassword" type="password" autocomplete="new-password" />
          </label>

          <label class="field">
            <span>Confirm password</span>
            <input id="confirmPassword" type="password" autocomplete="new-password" />
          </label>

          <div class="task-actions">
            <button class="btn" id="setPasswordBtn" type="button">
              Save password
            </button>
            <span class="hint" id="setPasswordMsg"></span>
          </div>
        </div>
      </div>

    </div>
  </section>
</main>

<!-- ===================================================== -->
<!-- COURSE HUB (shown when authorized) -->
<!-- ===================================================== -->
<div id="appShell" style="display:none;">
  <!-- your existing course hub HTML remains unchanged -->
</div>

<script type="module">
  import { configureSupabase, getSupabase } from "./assets/js/supabaseClient.js";
  import { initAuthGate } from "./assets/js/authGate.js";

  configureSupabase({
    url: "https://fzuslwrmhgaveulfewel.supabase.co",
    anonKey: "YOUR_ANON_KEY"
  });

  function setYear() {
    const el = document.getElementById("year");
    if (el) el.textContent = String(new Date().getFullYear());
  }

  await initAuthGate({
    onAuthed: () => setYear()
  });

  const sb = getSupabase();
  document.getElementById("signOutBtn")?.addEventListener("click", async () => {
    await sb.auth.signOut();
  });
</script>

</body>
</html>
