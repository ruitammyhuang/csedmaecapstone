<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="EDG6973 Sign in" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="robots" content="noindex,nofollow" />
  <title>EDG6973 - Sign in</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>

<body>
<a class="skip-link" href="#main">Skip to content</a>

<div id="auth-gate-container"></div>

<script type="module">
  import { configureSupabase, getSupabase } from "./assets/js/supabaseClient.js";
  import { SUPABASE_CONFIG } from "./assets/js/config.js";
  import { loadAuthGate } from "./assets/js/loadAuthGate.js";
  import { initAuthGate } from "./assets/js/authGate.js";

  configureSupabase(SUPABASE_CONFIG);
  await loadAuthGate();

  const sb = getSupabase();

  function repoBasePath() {
    const parts = window.location.pathname.split("/").filter(Boolean);
    const repo = parts[0] || "";
    return `/${repo}/`;
  }

  function urlFromRepoRoot(file) {
    return `${window.location.origin}${repoBasePath()}${file}`;
  }

  function resolveReturnTo() {
    const params = new URLSearchParams(window.location.search);
    const raw = params.get("returnTo");

    if (!raw) return urlFromRepoRoot("index.html");

    let decoded = "";
    try {
      decoded = decodeURIComponent(raw);
    } catch {
      return urlFromRepoRoot("index.html");
    }

    const base = repoBasePath();
    if (!decoded.startsWith(base)) return urlFromRepoRoot("index.html");

    return `${window.location.origin}${decoded}`;
  }

  const targetUrl = resolveReturnTo();

  const { data, error } = await sb.auth.getSession();
  if (error) console.error(error);

  if (data?.session) {
    window.location.replace(targetUrl);
  } else {
    await initAuthGate({
      onAuthed: () => window.location.replace(targetUrl)
    });
  }
</script>

</body>
</html>
