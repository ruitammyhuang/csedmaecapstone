<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="EDG6973 Sign in" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="robots" content="noindex,nofollow" />
  <title>EDG6973 - Sign in</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>

<body>
<a class="skip-link" href="#main">Skip to content</a>

<main id="main" class="container page">
  <div id="auth-gate-container"></div>
</main>

<script type="module">
  import { configureSupabase } from "./assets/js/supabaseClient.js";
  import { SUPABASE_CONFIG, siteUrl } from "./assets/js/config.js";
  import { loadAuthGate } from "./assets/js/loadAuthGate.js";
  import { initAuthGate } from "./assets/js/authGate.js";

  // Configure Supabase + load shared auth UI markup.
  configureSupabase(SUPABASE_CONFIG);
  await loadAuthGate();

  // Centralized auth page behavior:
  // - Always redirect to the course landing page after the user is fully authorized.
  // - Ignore returnTo on purpose (your stated requirement).
  // - If the page is opened with ?step=not_authorized, keep the user here and let authGate show the message.
  const params = new URLSearchParams(window.location.search);
  const step = (params.get("step") || "").toLowerCase();

  // Always send accepted users to the landing page.
  // For pending/unapproved users, we keep them on this page and show a message.
  const landingUrl = typeof siteUrl === "function"
    ? siteUrl("index.html")
    : new URL("index.html", window.location.href).toString();

  function shouldStayHere() {
    return step === "pending_approval" || step === "not_authorized";
  }

  await initAuthGate({
    onAuthed: () => {
      // Defensive: if this page was opened explicitly to show a pending/not-authorized state,
      // do not redirect (prevents flashing loops).
      if (shouldStayHere()) return;
      window.location.replace(landingUrl);
    }
  });
</script>

</body>
</html>
