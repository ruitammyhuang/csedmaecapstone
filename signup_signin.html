<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="EDG6973 Sign in" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="robots" content="noindex,nofollow" />
  <title>EDG6973 - Sign in</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>

<body>
<a class="skip-link" href="#main">Skip to content</a>

<main id="main" class="container page">
  <div id="auth-gate-container"></div>
</main>

<script type="module">
  import { configureSupabase } from "./assets/js/supabaseClient.js";
  import { SUPABASE_CONFIG, siteUrl } from "./assets/js/config.js";
  import { loadAuthGate } from "./assets/js/loadAuthGate.js";
  import { initAuthGate } from "./assets/js/authGate.js";

  // 1) Configure + load auth UI
  configureSupabase(SUPABASE_CONFIG);
  await loadAuthGate();

  // 2) Always go to the landing page after successful auth
  await initAuthGate({
    onAuthed: () => {
      window.location.replace(siteUrl("index.html"));
    }
  });
</script>

</body>
</html>
