<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="EDG6973 Sign in" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="robots" content="noindex,nofollow" />
  <title>EDG6973 - Sign in</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>

<body>
<a class="skip-link" href="#main">Skip to content</a>

<div id="auth-gate-container"></div>

<script type="module">
  import { configureSupabase, getSupabase } from "./assets/js/supabaseClient.js";
  import { SUPABASE_CONFIG, siteUrl } from "./assets/js/config.js";
  import { loadAuthGate } from "./assets/js/loadAuthGate.js";
  import { initAuthGate } from "./assets/js/authGate.js";

  // 1) Configure + load auth UI
  configureSupabase(SUPABASE_CONFIG);
  await loadAuthGate();

  const sb = getSupabase();

  // 2) Always go to the landing page after auth
  function goLanding() {
    window.location.replace(siteUrl("index.html"));
  }

  // 3) If already authed (including returning from email confirmation), go landing
  try {
    const { data, error } = await sb.auth.getSession();
    if (error) console.warn(error);

    if (data?.session) {
      goLanding();
    } else {
      // Show auth UI
      await initAuthGate({
        onAuthed: () => {
          // IMPORTANT: ignore any ?returnTo=... and always go to index
          goLanding();
        }
      });
    }
  } catch (e) {
    console.error(e);
    // If something odd happens, still allow auth UI to show
    await initAuthGate({
      onAuthed: () => goLanding()
    });
  }
</script>

</body>
</html>
