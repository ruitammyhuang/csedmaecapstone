<!-- partials/shared-modals.html -->

<dialog id="advisorModal" class="modal">
  <form method="dialog" class="modal-card" aria-labelledby="advisorTitle">
    <div class="modal-header">
      <h3 id="advisorTitle" class="modal-title">Contact Your Advisor</h3>
      <button class="btn icon ghost" value="cancel" aria-label="Close">✕</button>
    </div>

    <div class="modal-body">
      <div class="advisor">
        <img
          class="advisor-photo"
          src="images/dr._huang.jpg"
          alt="Dr. Rui Tammy Huang Headshot"
          width="150"
          height="150"
        />
        <div class="advisor-info">
          <div class="advisor-name"><strong>Rui Tammy Huang, Ph.D.</strong></div>

          <div class="advisor-line">
            <strong>Messages:</strong> Email to
            <a href="mailto:rui.huang@coe.ufl.edu">rui.huang@coe.ufl.edu</a>
          </div>

          <div class="advisor-line">
            <strong>Zoom:</strong>
            <a href="https://ufl.zoom.us/my/tammyhuang" target="_blank" rel="noopener">
              ufl.zoom.us/my/tammyhuang
            </a>
          </div>
        </div>
      </div>

      <div class="modal-actions">
        <button class="btn" value="cancel">Close</button>
      </div>
    </div>
  </form>
</dialog>
